name: Build and deploy AvePhO

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'avepho-pages-release' || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check announcement and paper publishing
        run: node admin-worker/verify.mjs
      - name: Retrieve approved announcements
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          ADMIN_URL: ${{ vars.ANNOUNCEMENTS_ADMIN_URL }}
          EXPORT_SECRET: ${{ secrets.ANNOUNCEMENTS_EXPORT_SECRET }}
        run: |
          if [[ "$ADMIN_URL" != https://*.workers.dev || -z "$EXPORT_SECRET" ]]; then
            echo "::error::Configure the Worker URL and export secret before deploying this version."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --max-filesize 1000000 \
            --header "Authorization: Bearer $EXPORT_SECRET" \
            "$ADMIN_URL/internal/release" --output "$RUNNER_TEMP/avepho-release.json"
      - name: Build and verify public files
        env:
          ADMIN_URL: ${{ vars.ANNOUNCEMENTS_ADMIN_URL }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]; then
            python3 src/build.py --output dist --announcements "$RUNNER_TEMP/avepho-release.json" --admin-url "$ADMIN_URL"
          else
            python3 src/build.py --output dist
          fi
          python3 src/verify.py --output dist
          node --check dist/assets/site.js
          node --check dist/assets/search.js
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
