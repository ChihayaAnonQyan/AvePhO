<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AvePhO 管理后台</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" type="module"></script>
</head>
<body>
  <header><strong>AvePhO</strong><a href="https://chihayaanonqyan.github.io/AvePhO/">查看官网</a></header>
  <main>
    <h1>管理后台</h1>
    <p id="status" role="status">正在确认登录状态…</p>
    <form id="sign-in" method="post" action="/auth/login" hidden>
      <label for="password">管理员密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button id="sign-in-button" type="submit">登录</button>
    </form>
    <div id="dashboard" class="admin-layout" hidden>
      <aside class="admin-sidebar">
        <nav class="management-nav" aria-label="发布管理">
          <button id="papers-tab" type="button" aria-pressed="true" aria-controls="papers-panel">发布试卷</button>
          <button id="announcements-tab" type="button" aria-pressed="false" aria-controls="announcements-panel">发布通告</button>
          <button id="article-tab" type="button" aria-pressed="false" aria-controls="article-panel">发布文章</button>
          <button id="committee-tab" type="button" aria-pressed="false" aria-controls="committee-panel">组委会管理</button>
        </nav>
        <form method="post" action="/api/logout"><button>退出登录</button></form>
      </aside>
      <div class="admin-work">
      <div id="announcements-panel" hidden>
        <section class="track">
          <p id="release-status"></p>
          <div class="actions">
            <button id="check" type="button" hidden>核对官网</button>
            <button id="retry" type="button" hidden>重试部署</button>
            <a id="run" hidden>查看 GitHub 部署记录</a>
          </div>
        </section>
        <div class="columns">
          <section>
            <div class="row"><h2>公告列表</h2><button id="new" type="button">新建</button></div>
            <ul id="list"></ul>
          </section>
          <section>
            <h2>编辑公告</h2>
            <form id="editor">
              <label for="title">标题</label><input id="title" maxlength="120" required>
              <label for="body">正文（支持 Markdown 和 LaTeX）</label><textarea id="body" rows="10" maxlength="5000" required></textarea>
              <div class="actions">
                <button type="submit">保存草稿</button>
                <button id="preview" type="button">预览</button>
                <button id="publish" type="button" disabled>发布</button>
                <button id="withdraw" type="button" disabled>撤回</button>
              </div>
            </form>
            <article id="preview-panel" hidden>
              <strong>预览</strong><h3 id="preview-title"></h3><div id="preview-body" class="rich-preview"></div>
            </article>
          </section>
        </div>
      </div>
        <div id="papers-panel">
          <div class="row"><h2>发布试卷</h2><button id="new-edition" type="button">新增届次</button></div>
          <ul id="edition-items" class="draft-list" aria-label="届次草稿"></ul>
          <form id="edition-form">
            <div class="paper-fields">
              <label>届次<input id="editor-edition-number" type="number" min="2" max="999" required></label>
              <label>举办年份<input id="editor-edition-year" type="number" min="2026" max="9999" required></label>
            </div>
            <p>时间按北京时间填写（UTC+08:00）。公开届次后，预定时间会自动显示在官网。</p>
            <div class="resource-grid">
              <fieldset id="editor-paper">
                <legend>试题 PDF</legend>
                <label>上传文件<input class="resource-file" type="file" accept=".pdf,application/pdf"></label>
                <p class="resource-current"></p>
                <label>文件版本<input class="resource-version" maxlength="32" value="v1.0"></label>
                <label>公开方式<select class="resource-mode"><option value="now">随届次公开</option><option value="later">定时公开</option></select></label>
                <label class="resource-time" hidden>公开时间<input class="resource-at" type="datetime-local"></label>
              </fieldset>
              <fieldset id="editor-solutions">
                <legend>答案 PDF</legend>
                <label>上传文件<input class="resource-file" type="file" accept=".pdf,application/pdf"></label>
                <p class="resource-current"></p>
                <label>文件版本<input class="resource-version" maxlength="32" value="v1.0"></label>
                <label>公开方式<select class="resource-mode"><option value="now">随届次公开</option><option value="later">定时公开</option></select></label>
                <label class="resource-time" hidden>公开时间<input class="resource-at" type="datetime-local"></label>
              </fieldset>
            </div>
            <div class="actions">
              <button type="submit">保存草稿</button>
              <button id="edition-release-button" type="button" disabled>公开届次</button>
            </div>
          </form>
        </div>
        <div id="article-panel" hidden>
          <div class="row"><h2>发布文章</h2><button id="new-article" type="button">新建文章</button></div>
          <ul id="article-items" class="draft-list" aria-label="文章草稿"></ul>
          <form id="article-form">
            <label>标题<input id="article-title" maxlength="120" required></label>
            <label>正文（支持 Markdown 和 LaTeX）<textarea id="article-body" rows="11" maxlength="12000" required></textarea></label>
            <div class="paper-fields">
              <label>插入图片<input id="article-image-upload" type="file" accept="image/png,image/jpeg,image/webp"></label>
              <label>添加 PDF 附件<input id="article-attachment-upload" type="file" accept=".pdf,application/pdf"></label>
            </div>
            <ul id="article-files"></ul>
            <div class="actions">
              <button type="submit">保存草稿</button>
              <button id="article-preview" type="button">预览</button>
              <button id="article-release-button" type="button" disabled>公开文章</button>
              <button id="article-withdraw" type="button" disabled>撤回文章</button>
            </div>
          </form>
          <div id="article-preview-panel" class="rich-preview" hidden></div>
        </div>
        <div id="committee-panel" hidden>
          <h2>组委会管理</h2>
          <p id="committee-status" role="status"></p>
          <form id="committee-form" hidden>
            <section class="roster-section" aria-labelledby="committee-teams-title">
              <div class="row"><h3 id="committee-teams-title">每届命题组</h3><button id="committee-add-team" type="button">新增届次</button></div>
              <div id="committee-teams"></div>
            </section>
            <section class="roster-section" aria-labelledby="committee-members-title">
              <div class="row"><h3 id="committee-members-title">命题委员会</h3><button id="committee-add-member" type="button">添加委员</button></div>
              <div id="committee-members"></div>
            </section>
            <div class="actions">
              <button type="submit">保存草稿</button>
              <button id="committee-publish" type="button" disabled>发布更新</button>
              <button id="committee-check" type="button" disabled>核对官网</button>
              <a id="committee-live" href="https://chihayaanonqyan.github.io/AvePhO/committee.html" hidden>查看官网名单</a>
              <a id="committee-run" href="https://github.com/ChihayaAnonQyan/AvePhO/actions/workflows/pages.yml">查看部署记录</a>
            </div>
          </form>
          <template id="committee-team-fields">
            <div class="roster-team">
              <label>届次<input name="number" type="number" min="1" max="999" required></label>
              <label>命题人（每行一位）<textarea name="names" rows="4" required></textarea></label>
              <button type="button" class="roster-remove">移除</button>
            </div>
          </template>
          <template id="committee-member-fields">
            <div class="roster-member">
              <label>昵称<input name="nickname" maxlength="120" required></label>
              <label>简介<textarea name="bio" rows="3" required></textarea></label>
              <button type="button" class="roster-remove">移除</button>
            </div>
          </template>
        </div>
        <div id="editor-deployment" class="actions">
          <button id="editor-retry" type="button">重新部署官网</button>
          <a id="editor-run" href="https://github.com/ChihayaAnonQyan/AvePhO/actions/workflows/pages.yml">查看部署记录</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
